# The simulation study as a Kubernetes Job (continuous deployment, optional part).
# Jenkins replaces IMAGE_PLACEHOLDER and BUILD_PLACEHOLDER before "kubectl apply",
# so every build runs its own Job with the image it has just tested.
apiVersion: batch/v1
kind: Job
metadata:
  name: ct-study-BUILD_PLACEHOLDER
  namespace: ct-research
  labels:
    app.kubernetes.io/name: ct-adaptive-engine
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ct-adaptive-engine
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: simulate
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          args: ["--learners", "50", "--max-steps", "150", "--seed", "42",
                 "--no-plot", "--out", "/tmp/results"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
