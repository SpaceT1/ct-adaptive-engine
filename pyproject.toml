[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-adaptive-engine"
version = "0.1.0"
description = "Bayesian Knowledge Tracing learner model and rule-based adaptation engine for a critical-thinking learning game (master's thesis prototype)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tileubay Alikhan" }]
keywords = ["bayesian-knowledge-tracing", "adaptive-learning", "intelligent-tutoring", "education", "simulation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "matplotlib>=3.7"]

[project.scripts]
ct-simulate = "ct_adaptive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["ct_adaptive"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
